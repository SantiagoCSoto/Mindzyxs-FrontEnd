<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/Logo1.png">
  <title>Nueva contraseña - Mindzyxs</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/inicio.css" />
  <link rel="stylesheet" href="../css/nueva_contrasena.css">
</head>

<body>

  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <header class="header-nav">
    <div class="logo-container">
      <a href="login.html" class="logo-link">
        <img src="../assets/Logo1.png" alt="Logo Mindzyxs" class="logo-img">
        Mindzyxs
      </a>
    </div>
  </header>

  <main id="main-content">
    <section class="nueva-contrasena-card">
      <h1>Nueva contraseña</h1>
      <p class="nueva-contrasena-subtitulo">Establece tu nueva contraseña</p>

      <div id="banner-error" class="alerta-error" role="alert" aria-live="assertive"></div>
      <div id="banner-exito" class="alerta-exito" role="status" aria-live="polite"></div>

      <form class="form-nueva-contrasena" id="form-nueva-contrasena" novalidate action="#">
        <div class="form-group">
          <label for="contrasena">Nueva contraseña</label>
          <div class="input-password-wrapper">
            <input type="password" id="contrasena" name="contrasena" placeholder="Mín. 6 caracteres (letras y números)" minlength="6" required aria-describedby="error-contrasena">
            <button type="button" class="btn-toggle-password" data-target="contrasena" aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
              <svg class="icono-toggle" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span id="error-contrasena" class="error-mensaje" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="confirmar-contrasena">Confirmar contraseña</label>
          <div class="input-password-wrapper">
            <input type="password" id="confirmar-contrasena" name="confirmar_contrasena" placeholder="Repite tu contraseña" minlength="6" required aria-describedby="error-confirmar">
            <button type="button" class="btn-toggle-password" data-target="confirmar-contrasena" aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
              <svg class="icono-toggle" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span id="error-confirmar" class="error-mensaje" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" id="btn-guardar" class="btn-nueva-contrasena">Guardar contraseña</button>

        <div class="nueva-contrasena-enlaces">
          <a href="login.html" id="link-cancelar" class="link-cancelar">Cancelar / Volver</a>
        </div>
      </form>
    </section>
  </main>

  <div id="modal-exito" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-exito-titulo">
    <div class="modal-contenido">
      <div class="modal-badge-exito">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 id="modal-exito-titulo">Contraseña actualizada</h2>
      <p>Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión.</p>
      <a href="login.html" class="btn-modal-continuar">Iniciar sesión</a>
    </div>
  </div>

  <script type="module" src="../js/controllers/nuevaContrasenaController.js"></script>
  <script src="../js/accessibility.js"></script>
  <script src="../js/cookies-banner.js"></script>
</body>

</html>
