<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Mindzyxs</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <header class="header-nav">
    <div class="logo-container">
      <a href="login.html" class="logo-link">
        <img src="../assets/Logo1.png" alt="Logo Mindzyxs" class="logo-img">
        Mindzyxs
      </a>
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Ayuda</a></li>
      </ul>
    </nav>

    <div class="header-auth-buttons">
      <a href="login.html" class="btn-login">Iniciar sesión</a>
      <a href="registro.html" class="btn-signup-header">Registrarse</a>
    </div>
  </header>

  <main>
    <section class="login-card">
      <h1>Inicio de sesión</h1>
      <p class="login-subtitulo">Accede según tu rol</p>

      <div id="banner-error-login" class="alerta-error">Correo o contraseña incorrectos</div>

      <form class="form-login" id="form-login" novalidate action="#">
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" autocomplete="email">
          <span id="error-correo" class="error-mensaje"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
          <span id="error-password" class="error-mensaje"></span>
        </div>

        <button type="submit" id="btn-login" class="btn-login-submit">Iniciar sesión</button>

        <div class="login-enlaces">
          <a href="#" id="link-olvido" class="link-accion">¿Olvidaste tu contraseña?</a>
          <a href="registro.html" id="link-registro" class="link-accion">Registrarse</a>
        </div>

        <div class="login-cancelar-contenedor">
          <a href="registro.html" id="link-cancelar" class="link-cancelar">Cancelar / Volver</a>
        </div>

        
      </form>
    </section>
  </main>

  <div id="modal-rol" class="modal-overlay">
    <div class="modal-contenido">
      <div class="modal-badge-exito">
        <span>&check;</span>
      </div>
      <h2 id="modal-titulo">Sesión iniciada &mdash; Rol</h2>
      <p id="modal-subtitulo">Redirigiendo a: Panel</p>
      <button type="button" id="btn-modal-continuar" class="btn-modal-continuar">Continuar</button>
    </div>
  </div>

  <script type="module" src="../js/controllers/loginController.js"></script>
</body>

</html>
