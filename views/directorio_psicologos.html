<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/Logo1.png" />
  <title>Directorio de psicólogos - Mindzyxs</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/inicio.css" />
</head>

<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-lav"></div>
  </div>

  <header class="header-nav">
    <div class="logo-container">
      <a href="inicio.html" class="logo-link">
        <img src="../assets/Logo1.png" alt="Logo Mindzyxs" class="logo-img" />
        <span>Mindzyxs</span>
      </a>
    </div>

    <nav class="main-nav" aria-label="Navegación principal">
      <ul>
        <li class="nav-inicio"><a href="inicio.html">Inicio</a></li>
        <li><a href="inicio.html#nosotros">Nosotros</a></li>
        <li><a href="inicio.html#ayuda">Ayuda</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <div class="header-auth-buttons">
        <button type="button" id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <a href="panel_paciente.html" class="btn-volver-landing" style="background:#FFFFFF;border:1.5px solid #CBD5E1;color:#475569;font-size:13px;font-weight:600;padding:9px 24px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;margin-bottom:14px;">&larr; Volver al panel</a>
    <section class="card section-sensibles">
      <div class="panel-head">
        <h1>Directorio de psicólogos</h1>
        <p class="sub">Conoce sus especialidades y pacientes asignados para ver cuál te cuadra mejor.</p>
      </div>
      <div class="dash-invitado" id="dashDirectorio">
        <div class="grid grid-avail" id="dirGrid"></div>
        <div class="empty" id="dirEmpty" style="display:none;">
          <p>No hay psicólogos disponibles en este momento.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-in">
      <a href="privacidad.html">Privacidad</a>
      <a href="cookies.html">Cookies</a>
      <a href="terminos.html">Términos</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../js/controllers/directorioController.js"></script>
  <script src="../js/cookies-banner.js"></script>
  <script src="../js/sesion-header.js"></script>
</body>

</html>
