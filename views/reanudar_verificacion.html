<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/Logo1.png">
  <title>Reanudar verificación - Mindzyxs</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/inicio.css" />
  <link rel="stylesheet" href="../css/verificacion.css">
</head>

<body>

  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <header class="header-nav">
    <div class="logo-container">
      <a href="login.html" class="logo-link">
        <img src="../assets/Logo1.png" alt="Logo Mindzyxs" class="logo-img">
        Mindzyxs
      </a>
    </div>

    <nav class="main-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="ayuda.html">Ayuda</a></li>
      </ul>
    </nav>

    <div class="header-auth-buttons">
      <a href="login.html" class="btn-login">Iniciar sesión</a>
      <a href="registro.html" class="btn-signup-header">Registrarse</a>
    </div>
  </header>

  <main id="main-content">
    <section class="verificacion-card" style="max-width: 420px;">
      <h1>Reanudar verificación</h1>
      <p class="verificacion-subtitulo">¿No completaste tu registro? Introduce tu correo para reenviar el código.</p>

      <form class="form-verificacion" id="form-reanudar" novalidate>
        <div class="form-group">
          <label for="correo-reanudar">Correo registrado</label>
          <input type="email" id="correo-reanudar" name="correo" autocomplete="email" required
            placeholder="tu@correo.com" aria-describedby="error-correo-reanudar">
          <span id="error-correo-reanudar" class="error-mensaje" role="alert" aria-live="polite"></span>
        </div>

        <div id="banner-error-reanudar" class="alerta-error" role="alert" aria-live="assertive"></div>
        <div id="banner-exito-reanudar" class="alerta-exito" role="status" aria-live="polite"></div>

        <button type="submit" id="btn-reanudar" class="btn-verificar">Reenviar código</button>

        <div class="verificacion-acciones">
          <a href="login.html" id="link-volver-login" class="link-cancelar">Volver al login</a>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="../js/controllers/reanudarVerificacionController.js"></script>
  <script src="../js/accessibility.js"></script>
  <script src="../js/cookies-banner.js"></script>
</body>

</html>
