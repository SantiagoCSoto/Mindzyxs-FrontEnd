<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/Logo1.png" />
  <title>Mindzyx — Asignar cuestionario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/inicio.css" />
  <link rel="stylesheet" href="../css/asignar_cuestionario.css" />
</head>

<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-lav"></div>
  </div>

  <header class="header-nav">
    <div class="logo-container">
      <a href="inicio.html" class="logo-link">
        <img src="../assets/Logo1.png" alt="Logo Mindzyxs" class="logo-img" />
        <span>Mindzyxs</span>
      </a>
    </div>
    <nav class="main-nav" aria-label="Navegación principal">
      <ul>
        <li class="nav-inicio"><a href="inicio.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="ayuda.html">Ayuda</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <div class="header-auth-buttons">
        <button type="button" id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <a href="mis_cuestionarios.html" class="btn-volver-landing" id="backBtn">
      <svg class="icon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Volver a cuestionarios
    </a>

    <!-- Pantalla: elegir un cuestionario publicado -->
    <section class="card screen active" id="screenLista">
      <h1>Asignar cuestionario</h1>
      <p class="sub">Elija un cuestionario publicado para asignarlo.</p>
      <div id="listaC" tabindex="0"></div>
    </section>

    <!-- Pantalla: marcar pacientes autorizados -->
    <section class="card screen" id="screenAsignar">
      <h2 id="asigTitulo">Asignar</h2>
      <p class="sub">Solo pacientes que le autorizaron. Marque con las casillas.</p>
      <div id="listaPac" tabindex="0"></div>
      <div class="err-msg" id="eSel" role="alert">Debes seleccionar al menos un paciente.</div>
      <div class="actions">
        <button type="button" class="btn btn-save" id="btnAsignar">
          <svg class="btn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          Asignar cuestionario
        </button>
        <button type="button" class="btn btn-cancel" id="btnVolver">Volver</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-in">
      <a href="privacidad.html">Privacidad</a>
      <a href="cookies.html">Cookies</a>
      <a href="terminos.html">Términos</a>
      <a href="#" class="aviso-link" id="footerAviso" role="button" aria-haspopup="dialog"><span class="aviso-ico"><svg class="icon-inline" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A45C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span> Aviso: no diagnóstico</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../js/controllers/asignarCuestionarioController.js"></script>
  <script src="../js/cookies-banner.js"></script>
  <script src="../js/sesion-header.js"></script>
</body>

</html>
