<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Mindzyxs</title>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Recuperar contraseña</h1>
            <p class="subtitle">Te enviaremos un código a tu correo</p>
            
            <form>
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                </div>
                
                <button type="submit">Enviar código</button>
            </form>
            
            <div class="form-footer">
                <a href="login.html">Cancelar / Volver</a>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
            <div class="info-text">
                <p>Vacío o sin @ → error y no envía. Con <span>paciente@test.com</span> → envía.</p>
                <p>Con <span>noexiste@test.com</span> → mensaje genérico de seguridad.</p>
            </div>
        </div>
    </div>
</body>
</html>
