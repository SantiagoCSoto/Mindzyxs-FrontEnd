<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Mindzyxs</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/recuperar_contrasena.css">
</head>
<body>
    <div class="recuperar-card">
        <h1>Recuperar contraseña</h1>
        <p class="recuperar-subtitulo">Te enviaremos un código a tu correo</p>
        
        <div id="banner-error" class="alerta-error"></div>
        <div id="banner-exito" class="alerta-exito"></div>
        
        <form class="form-recuperar">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
            </div>
            
            <button type="submit" class="btn-recuperar-submit">Enviar código</button>
        </form>
        
        <div class="recuperar-enlaces">
            <a href="login.html" class="link-accion">Cancelar / Volver</a>
            <a href="#" class="link-accion">¿Olvidaste tu contraseña?</a>
        </div>
        
        <div class="info-texto">
            <p>Vacío o sin @ → error y no envía. Con <strong>paciente@test.com</strong> → envía.</p>
            <p>Con <strong>noexiste@test.com</strong> → mensaje genérico de seguridad.</p>
        </div>
    </div>
    
    <script src="./js/recuperar_contrasena.js"></script>
</body>
</html>
