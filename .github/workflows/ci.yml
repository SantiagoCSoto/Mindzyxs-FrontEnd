name: CI - Frontend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Frontend is static (HTML/CSS/JS). No build required."
          test -f js/services/apiClient.js
          grep -n "API_BASE_URL" js/services/apiClient.js

      - name: Create PR develop -> main (if not exists)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PR_COUNT=$(gh pr list --base main --head develop --state open --json number --jq 'length' 2>/dev/null)
          set -e
          echo "Open PRs develop->main: ${PR_COUNT:-0}"
          if [ "${PR_COUNT:-0}" = "0" ]; then
            gh pr create --base main --head develop \
              --title "Merge develop into main" \
              --body "PR automatico generado por CI tras verificacion exitosa. Revisar conflictos antes de mergear."
          else
            echo "Ya existe un PR abierto de develop a main."
          fi
