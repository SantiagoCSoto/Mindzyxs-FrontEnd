name: CD - Deploy Frontend to Azure Static Web Apps (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps (production)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ""

# Required secrets (production):
#   AZURE_STATIC_WEB_APPS_API_TOKEN_PROD -> token de despliegue del Static Web App de producción
# Se ejecuta cuando el PR de develop a main es mergeado.
