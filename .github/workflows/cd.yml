name: CD - Deploy Frontend to Azure Static Web Apps (develop)

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps (staging)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ""

# Required secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN -> token de despliegue del Static Web App
# Antes de desplegar, cambiar API_BASE_URL en js/services/apiClient.js a la URL de producción del App Service del back-end.
