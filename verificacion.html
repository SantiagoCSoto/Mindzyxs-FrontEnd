<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de cuenta - Mindzyx</title>
  <link rel="stylesheet" href="verificacion.css">
</head>

<body>

  <header class="header-nav">
    <div class="logo-container">
      <a href="registro.html" class="logo-link">
        <span class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="2.2" fill="none" />
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5" stroke="#ffffff" stroke-width="2.2" />
          </svg>
        </span>
        Mindzyx
      </a>
    </div>

  </header>

  <main>
    <section class="verificacion-card">
      <h1>Verificación de cuenta</h1>
      <p class="verificacion-subtitulo">Ingresa el código enviado a tu correo</p>

      <div class="chip-correo">
        <span class="icono-correo">📨</span>
        <span>Código enviado a <strong>tu@correo.com</strong> &bull; válido 5 min</span>
      </div>

      <form class="form-verificacion" id="form-verificacion" action="#">
        <div class="form-group">
          <label for="codigo-verificacion">Código de verificación</label>
          <div class="input-codigo-contenedor">
            <input type="text" id="codigo-verificacion" name="codigo_verificacion" maxlength="6"
              placeholder="&mdash;  &mdash;  &mdash;  &mdash;  &mdash;  &mdash;" autocomplete="off" required>
          </div>
        </div>

        <button type="submit" id="btn-verificar" class="btn-verificar">Verificar</button>

        <div class="verificacion-acciones">
          <button type="button" id="btn-reenviar" class="link-accion">Reenviar código</button>
          <a href="registro.html" id="link-cancelar" class="link-cancelar">Cancelar</a>
        </div>

        <p class="nota-pruebas">
          Prueba: código correcto <strong>123456</strong> &bull; incorrecto otro &bull; expirado <strong>000000</strong>
        </p>
      </form>
    </section>
  </main>

  <script src="verificacion.js"></script>
</body>

</html>
